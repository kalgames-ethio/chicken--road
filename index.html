<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KalBet Mobile UI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    display:flex;
    justify-content:center;
    padding:20px;
    color:white;
}

.app{
    width:380px;
    background:#0d0f10;
    border-radius:22px;
    overflow:hidden;
    border:2px solid #1d1f20;
    box-shadow:0 0 30px rgba(0,0,0,0.6);
}

/* TOP */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px;
    background:#111;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
}

.logo-box{
    width:38px;
    height:38px;
    border-radius:10px;
    background:linear-gradient(180deg,#63ff72,#1f9f43);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:#111;
}

.logo-text{
    font-size:26px;
    font-weight:900;
    color:#73ff77;
}

.balance{
    background:#161a1c;
    border:1px solid #2b3133;
    padding:10px 14px;
    border-radius:12px;
    color:#fff;
    font-weight:bold;
}

/* BANNER */

.banner{
    margin:12px;
    height:150px;
    border-radius:18px;
    background:linear-gradient(135deg,#0f3f11,#37d64d);
    position:relative;
    overflow:hidden;
    padding:20px;
}

.banner h1{
    font-size:33px;
    line-height:1.1;
    margin-top:10px;
}

.banner p{
    margin-top:10px;
    color:#d6ffd8;
}

.circle{
    position:absolute;
    right:-20px;
    top:15px;
    width:160px;
    height:160px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
}

.gift{
    position:absolute;
    right:30px;
    bottom:15px;
    font-size:55px;
}

/* MENU */

.menu-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:0 12px;
}

.menu-card{
    background:#131617;
    border:1px solid #222829;
    border-radius:14px;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.menu-card i{
    font-size:24px;
    color:#66ff73;
}

.menu-card span{
    font-size:14px;
    font-weight:bold;
}

/* GAMES */

.games{
    padding:14px 12px 90px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.game{
    background:#181b1d;
    border-radius:14px;
    overflow:hidden;
    border:1px solid #25292b;
}

.game img{
    width:100%;
    height:90px;
    object-fit:cover;
}

.game-info{
    padding:8px;
}

.game-title{
    font-size:13px;
    font-weight:bold;
}

.players{
    margin-top:4px;
    color:#63ff72;
    font-size:12px;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    width:380px;
    background:#121516;
    border-top:1px solid #24292b;
    display:flex;
    justify-content:space-around;
    padding:12px 0;
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    color:#7d8487;
    font-size:12px;
}

.nav-item.active{
    color:#63ff72;
}

.nav-item i{
    font-size:18px;
}
</style>
</head>

<body>

<div class="app">

    <!-- TOPBAR -->
    <div class="topbar">

        <div class="logo">
            <div class="logo-box">KG</div>
            <div class="logo-text">KalBet</div>
        </div>

        <div class="balance">
            1,000.00 ETB
        </div>

    </div>

    <!-- BANNER -->
    <div class="banner">

        <div class="circle"></div>

        <h1>KalBet<br>Casino</h1>

        <p>አዳዲስ ጨዋታዎች እና ሽልማቶች</p>

        <div class="gift">🎁</div>

    </div>

    <!-- MENU -->
    <div class="menu-grid">

        <div class="menu-card">
            <span>ዕለታዊ ሽልማት</span>
            <i class="fa-solid fa-gift"></i>
        </div>

        <div class="menu-card">
            <span>VIP ክለብ</span>
            <i class="fa-solid fa-crown"></i>
        </div>

    </div>

    <!-- GAMES -->
    <div class="games">

        <div class="game">
            <img src="https://picsum.photos/200/120?1">
            <div class="game-info">
                <div class="game-title">Chicken Road</div>
                <div class="players">Br 51.9K</div>
            </div>
        </div>

        <div class="game">
            <img src="https://picsum.photos/200/120?2">
            <div class="game-info">
                <div class="game-title">Lucky Spin</div>
                <div class="players">Br 28.9K</div>
            </div>
        </div>

        <div class="game">
            <img src="https://picsum.photos/200/120?3">
            <div class="game-info">
                <div class="game-title">777 Slot</div>
                <div class="players">Br 61.2K</div>
            </div>
        </div>

        <div class="game">
            <img src="https://picsum.photos/200/120?4">
            <div class="game-info">
                <div class="game-title">Leno</div>
                <div class="players">Br 39.1K</div>
            </div>
        </div>

        <div class="game">
            <img src="https://picsum.photos/200/120?5">
            <div class="game-info">
                <div class="game-title">Bingo</div>
                <div class="players">Br 29.5K</div>
            </div>
        </div>

        <div class="game">
            <img src="https://picsum.photos/200/120?6">
            <div class="game-info">
                <div class="game-title">Aviator</div>
                <div class="players">Br 81.4K</div>
            </div>
        </div>

    </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

    <div class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </div>

    <div class="nav-item">
        <i class="fa-solid fa-gamepad"></i>
        <span>Games</span>
    </div>

    <div class="nav-item active">
        <i class="fa-solid fa-wallet"></i>
        <span>Wallet</span>
    </div>

    <div class="nav-item">
        <i class="fa-solid fa-crown"></i>
        <span>VIP</span>
    </div>

    <div class="nav-item">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </div>

</div>

</body>
</html>
