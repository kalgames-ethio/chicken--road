<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalgames - Game Center</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background-color: #0e0f12; color: #fff; display: flex; flex-direction: column; align-items: center; }
        
        .top-bar { 
            width: 100%; max-width: 400px; display: flex; justify-content: space-between; 
            align-items: center; padding: 15px; background: #16171e; border-bottom: 2px solid #1f2029;
        }
        .logo { font-size: 20px; font-weight: 900; color: #ff9f43; font-style: italic; }
        
        .menu-container { width: 100%; max-width: 400px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .welcome-msg { font-size: 16px; color: #a0a5b5; font-weight: bold; margin-bottom: 5px; }
        
        /* Game Card Style */
        .game-card {
            background: #16171e; border: 1px solid #2d303f; border-radius: 12px; padding: 15px;
            display: flex; align-items: center; justify-content: space-between; text-decoration: none;
            color: #fff; transition: all 0.2s ease; border-bottom: 4px solid #111218;
        }
        .game-card:active { transform: scale(0.97); }
        .game-info { display: flex; align-items: center; gap: 15px; }
        .game-icon { font-size: 32px; background: #21232b; padding: 10px; border-radius: 10px; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; }
        .game-details h3 { margin: 0; font-size: 16px; font-weight: 900; color: #fff; }
        .game-details p { margin: 4px 0 0 0; font-size: 12px; color: #7c8091; }
        
        .play-btn {
            background: linear-gradient(180deg, #ff9f43, #d97714); color: #fff; border: none;
            padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="logo">🎮 Kalgames</span>
    </div>

    <div class="menu-container">
        <div class="welcome-msg">የሚጫወቱትን ጨዋታ ይምረጡ፦</div>

        <a href="chicken.html" class="game-card">
            <div class="game-info">
                <div class="game-icon">🐔</div>
                <div class="game-details">
                    <h3>Chicken Road</h3>
                    <p>ዶሮዋን ከቦምብ አድነህ አሻግር!</p>
                </div>
            </div>
            <button class="play-btn">PLAY</button>
        </a>

        <a href="keno.html" class="game-card">
            <div class="game-info">
                <div class="game-icon">🔢</div>
                <div class="game-details">
                    <h3>Keno Game</h3>
                    <p>እድለኛ ቁጥሮችዎን ይምረጡ!</p>
                </div>
            </div>
            <button class="play-btn">PLAY</button>
        </a>

        <a href="zingo.html" class="game-card">
            <div class="game-info">
                <div class="game-icon">🎡</div>
                <div class="game-details">
                    <h3>Zingo Slot</h3>
                    <p>ዕድልዎን በዚንጎ ይሞክሩ!</p>
                </div>
            </div>
            <button class="play-btn">PLAY</button>
        </a>
    </div>

</body>
</html>
