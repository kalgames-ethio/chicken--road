<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KalBet - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #090c10; --card-bg: #12171e; --border-color: #1c2530; --accent-gold: #ffbd14; --accent-green: #00e676; --text-gray: #788c9f; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background-color: var(--bg-dark); color: #fff; padding-bottom: 90px; overflow-x: hidden; }

        /* HEADER */
        .header { position: sticky; top:0; background: #12171e; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; z-index: 100; border-bottom: 1px solid var(--border-color); }
        .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .brand-logo { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--accent-gold); }
        .brand-text { font-weight: 900; font-size: 18px; color: var(--accent-gold); font-style: italic; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .wallet-pill { background: #090c10; padding: 5px 10px; border-radius: 30px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border-color); }
        .currency-icon { background: #0088cc; color: #fff; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
        .balance-val { font-weight: 800; color: #fff; font-size: 14px; }
        .btn-deposit { background: var(--accent-green); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 900; font-size: 12px; cursor: pointer; }

        /* BANNER */
        .banner { margin: 12px; background: linear-gradient(135deg, #1d2633, #12171e); border-radius: 14px; padding: 16px; position: relative; border: 1px solid var(--border-color); overflow: hidden; }
        .banner h2 { margin: 0; font-size: 18px; color: #fff; font-weight: 900; }
        .banner p { margin: 4px 0 0 0; color: var(--text-gray); font-size: 11px; font-weight: bold; }
        .banner-icon { position: absolute; right: -5px; top: -5px; font-size: 70px; color: var(--accent-gold); opacity: 0.15; transform: rotate(-15deg); }

        /* 4 MIDDLE BUTTONS (ሊንክ እንዲሆኑ የተደረጉ) */
        .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 12px; }
        .q-item { background: var(--card-bg); border-radius: 12px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 5px; border: 1px solid var(--border-color); text-decoration: none; color: inherit; cursor: pointer; }
        .q-icon { font-size: 20px; }
        .q-label { font-size: 10px; color: var(--text-gray); font-weight: bold; text-align: center; }

        /* GAME GRID */
        .section-title { padding: 16px 14px 8px; font-size: 13px; font-weight: bold; color: var(--text-gray); }
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 12px; }
        .game-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; text-decoration: none; color: #fff; }
        .game-left { display: flex; align-items: center; gap: 8px; }
        .game-icon-box { font-size: 20px; width: 34px; height: 34px; background: #1c2530; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .game-name { font-size: 13px; font-weight: bold; }
        .play-badge-btn { background: var(--accent-gold); color: #000; border: none; padding: 4px 10px; border-radius: 6px; font-weight: 900; font-size: 10px; }

        /* WALLET MODAL (DEPOSIT ONLY) */
        .modal { position: fixed; bottom: -100%; left: 0; width: 100%; height: 75%; background: var(--bg-dark); z-index: 1000; border-radius: 20px 20px 0 0; padding: 20px; transition: bottom 0.3s; border-top: 2px solid var(--accent-gold); }
        .modal.active { bottom: 0; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 6px; font-weight: bold; }
        .input-group input { width: 100%; background: #12171e; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; color: #fff; outline: none; }
        .btn-confirm { width: 100%; background: var(--accent-green); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; }
        .error-txt { font-size: 11px; color: #ff4444; margin-top: 4px; font-weight: bold; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #12171e; display: flex; justify-content: space-around; padding: 8px 0 20px 0; border-top: 1px solid var(--border-color); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-gray); text-decoration: none; font-size: 10px; font-weight: bold; width: 20%; }
        .nav-item.active { color: var(--accent-gold); }
        .nav-item i { font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="#" class="brand">
            <img src="1000002633.png" class="brand-logo">
            <span class="brand-text">KalBet</span>
        </a>
        <div class="header-right">
            <div class="wallet-pill">
                <div class="currency-icon">Br</div>
                <span class="balance-val" id="main-balance">0.00</span>
            </div>
            <button class="btn-deposit" onclick="openDeposit()"><i class="fa-solid fa-plus"></i> አስገባ</button>
        </div>
    </div>

    <div class="banner">
        <h2>CRYPTO SPIN</h2>
        <p>SPIN FOR UNLIMITED BONUS</p>
        <i class="fa-solid fa-dharmachakra banner-icon"></i>
    </div>

    <div class="quick-grid">
        <a href="spin.html" class="q-item"><span class="q-icon">🎡</span><span class="q-label">ዕድለኛ ስፒን</span></a>
        <div class="q-item" onclick="alert('በቅርቡ ይከፈታል!')"><span class="q-icon">🪙</span><span class="q-label">ሻሞ ኮይን</span></div>
        <a href="coupon.html" class="q-item"><span class="q-icon">🎟️</span><span class="q-label">ኩፖን</span></a>
        <div class="q-item" onclick="alert('VIP ገጽ በቅርቡ ይለቀቃል!')"><span class="q-icon">👑</span><span class="q-label">VIP ደረጃ</span></div>
    </div>

    <div class="section-title">የተመረጡ ጨዋታዎች</div>

    <div class="game-grid">
        <a href="aviator.html" class="game-card"><div class="game-left"><div class="game-icon-box">🚀</div><span class="game-name">Aviator</span></div><button class="play-badge-btn">PLAY</button></a>
        <a href="chicken.html" class="game-card"><div class="game-left"><div class="game-icon-box">🐔</div><span class="game-name">Chicken</span></div><button class="play-badge-btn">PLAY</button></a>
        <a href="chicken_roast.html" class="game-card"><div class="game-left"><div class="game-icon-box">🍗</div><span class="game-name">Roast</span></div><button class="play-badge-btn">PLAY</button></a>
        <a href="mines.html" class="game-card"><div class="game-left"><div class="game-icon-box">💎</div><span class="game-name">Mines</span></div><button class="play-badge-btn">PLAY</button></a>
    </div>

    <div id="deposit-modal" class="modal">
        <div class="modal-header">
            <h3 style="margin:0; font-size:16px;">ገንዘብ አስገባ</h3>
            <i class="fa-solid fa-xmark" style="font-size: 22px; cursor: pointer; color: var(--text-gray);" onclick="closeDeposit()"></i>
        </div>
        <div class="input-group">
            <label>የብር መጠን (ዝቅተኛው 50 ብር)</label>
            <input type="number" id="dep-amount" placeholder="0.00">
            <div class="error-txt" id="dep-error"></div>
        </div>
        <div class="input-group">
            <label>የክፍያ ማረጋገጫ ሊንክ / የደረሰኝ ቁጥር</label>
            <input type="text" id="proof-link" placeholder="ማስረጃ ሊንክ እዚህ ይለጥፉ">
        </div>
        <button class="btn-confirm" onclick="processDeposit()">ማስረጃውን ላክ</button>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item"><i class="fa-solid fa-gift"></i><span>ቦነስ</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-users"></i><span>ጋብዝ</span></a>
        <a href="index.html" class="nav-item active"><i class="fa-solid fa-gamepad"></i><span>ጨዋታዎች</span></a>
        <a href="withdraw.html" class="nav-item"><i class="fa-solid fa-wallet"></i><span>ዋሌት</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-user"></i><span>መገለጫ</span></a>
    </div>

    <script>
        let balance = 0.00;
        if(localStorage.getItem('kb_balance')) { balance = parseFloat(localStorage.getItem('kb_balance')); }
        document.getElementById('main-balance').innerText = balance.toFixed(2);

        function openDeposit() { document.getElementById('deposit-modal').classList.add('active'); }
        function closeDeposit() { document.getElementById('deposit-modal').classList.remove('active'); }

        function processDeposit() {
            const amt = parseFloat(document.getElementById('dep-amount').value);
            const proof = document.getElementById('proof-link').value;
            if(amt < 50 || isNaN(amt)) { document.getElementById('dep-error').innerText = "⚠️ ስህተት፡ ዝቅተኛው ማስገቢያ 50 ብር ነው!"; return; }
            if(!proof) { alert("እባክዎን የላኩበትን ማስረጃ ሊንክ ያስገቡ!"); return; }
            alert("✅ ማስረጃው ለ Admin ተልኳል!");
            closeDeposit();
        }
    </script>
</body>
</html>
