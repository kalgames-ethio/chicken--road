<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KalBet - Ultimate Telegram Bot UI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
html {
    scroll-behavior: smooth;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body{
    background:#000;
    color:white;
    display:flex;
    justify-content:center;
    padding: 0;
    overflow-x: hidden;
}

.app{
    width: 100%;
    max-width: 420px;
    background:#060809;
    min-height: 100vh;
    position:relative;
    padding-bottom:95px;
}

/* 🔄 TAB SYSTEM */
.page {
    display: none;
}
.page.active {
    display: block;
}

/* 🔝 TOPBAR (ልክ እንደ ፎቶው) */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
    background:#0d1113;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #171c1f;
}

.logo-section{
    display:flex;
    align-items:center;
    gap:8px;
}

/* ያንተ የቦት ሎጎ ምስል መገኛ */
.logo-img{
    width:35px;
    height:35px;
    border-radius:50%;
    border: 1px solid #63ff72;
    object-fit: cover;
}

.brand-name{
    font-size:18px;
    font-weight:900;
    color:#ffffff;
}
.brand-name span {
    color: #39e58c;
}

.topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.balance-display{
    background:#13181b;
    border:1px solid #20292e;
    padding:8px 12px;
    border-radius:10px;
    font-weight:bold;
    font-size: 13px;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 5px;
}

.deposit-btn-top{
    background: linear-gradient(180deg, #a6ffb3, #19b043);
    color: #000000;
    border: none;
    padding: 8px 14px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 13px;
    box-shadow: 0 0 10px rgba(99, 255, 114, 0.4);
    cursor: pointer;
}

/* 🎫 HERO BANNER */
.hero-banner{
    margin:15px;
    border-radius:20px;
    background: linear-gradient(135deg, #051a0a 0%, #0d3d17 50%, #155e24 100%);
    border: 1px solid #1f6e2f;
    padding:20px;
    position:relative;
    overflow:hidden;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.banner-text-side {
    max-width: 60%;
    z-index: 2;
}

.banner-text-side h1{
    font-size:22px;
    font-weight: 800;
    line-height:1.2;
    color: #ffffff;
}

.banner-text-side p{
    margin-top:6px;
    font-size: 13px;
    color:#aeffbe;
}

.banner-img-side {
    position: relative;
    width: 100px;
    height: 100px;
    z-index: 2;
}

.banner-img-side img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.carousel-dots {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
}

.dot.active {
    background: #63ff72;
    width: 15px;
    border-radius: 4px;
}

/* 🎛️ ባለ 2-አምድ ፈጣን ሜኑ */
.quick-menu-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    padding: 0 15px;
    margin-bottom: 20px;
}

.quick-card{
    background:#0d1215;
    border:1px solid #1a2226;
    border-radius:14px;
    padding:12px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    cursor: pointer;
}

.quick-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.quick-icon-circle {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #141c20;
    display: flex;
    align-items: center;
    justify-content: center;
}

.quick-card span{
    font-size:12px;
    font-weight:bold;
    color: #ffffff;
}

.quick-card p{
    font-size: 10px;
    color: #667780;
    margin-top: 2px;
}

.quick-card i.arrow {
    color:#445560;
    font-size:12px;
}

/* 🎮 GAMES GRID SECTION */
.section-header{
    padding:10px 15px;
    font-size:15px;
    font-weight:bold;
    color: #8e9aa2;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.games-container{
    padding: 0 15px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.game-item-card{
    text-align:center;
    cursor: pointer;
}

.game-cover-box{
    position: relative;
    width:100%;
    aspect-ratio: 1/1;
    border-radius:16px;
    border:1px solid #1c252c;
    box-shadow: 0 6px 12px rgba(0,0,0,0.5);
    overflow: hidden;
}

.game-cover-box img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.2s;
}

.game-item-card:active .game-cover-box img{
    transform: scale(0.95);
}

.game-label-name{
    font-size:12px;
    font-weight: 600;
    margin-top:8px;
    color:#ffffff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.game-stats-vol{
    margin-top:3px;
    color:#39e58c;
    font-size:11px;
    font-weight: bold;
}

/* 🎡 ዕድለኛ ስፒን ገጽ */
.spin-container {
    padding: 20px;
    text-align: center;
}
.wheel-wrapper {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 30px auto;
}
.wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 6px solid #39e58c;
    background: conic-gradient(#149c3b 0deg 60deg, #111 60deg 120deg, #63ff72 120deg 180deg, #222 180deg 240deg, #39e58c 240deg 300deg, #333 300deg 360deg);
    transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1);
}
.pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    color: #39e58c;
    z-index: 10;
}
.spin-btn {
    background: linear-gradient(180deg, #67ff7b, #149c3b);
    color: #000;
    border: none;
    padding: 15px 50px;
    font-weight: bold;
    border-radius: 14px;
    cursor: pointer;
    font-size: 16px;
    box-shadow: 0 4px 15px rgba(57, 229, 140, 0.3);
}

/* 💳 WALLET STYLE */
.wallet-wrapper-box{
    padding:20px 15px;
}
.balance-card-premium{
    background: linear-gradient(135deg, #0d1316, #072211);
    border: 1px solid #153c23;
    border-radius: 20px;
    padding: 20px;
}

/* 📲 ጌም ሞዳል (IFRAME) */
#gameModal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000;
    z-index:99999;
    flex-direction:column;
}

/* 🧭 NAVIGATION BAR (ልክ በፎቶው ላይ እንዳለው አረንጓዴ ማዕከል) */
.bottom-navigation-bar{
    position:fixed;
    bottom:0;
    width:100%;
    max-width:420px;
    background:#0b0e10;
    border-top:1px solid #141a1d;
    display:flex;
    justify-content:space-around;
    align-items: center;
    padding:10px 0 15px 0;
    z-index: 999;
}

.nav-link-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    color:#536470;
    font-size:11px;
    cursor: pointer;
    flex: 1;
    text-align: center;
}

.nav-link-item i{
    font-size:18px;
}

.nav-link-item.active{
    color:#ffffff;
}

/* መሃል ላይ የምትገኘው አረንጓዴ መጫወቻ ቁልፍ */
.nav-link-item.center-play-hub {
    background: #22c55e;
    color: #000000;
    width: 55px;
    height: 45px;
    border-radius: 8px;
    justify-content: center;
    font-weight: bold;
    flex: none;
    box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
}
.nav-link-item.center-play-hub i {
    font-size: 20px;
    color: #000;
}
</style>
</head>
